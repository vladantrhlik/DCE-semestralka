services:
  zookeeper1:
    build: ./zookeeper
    environment:
      ZOO_MY_ID: "1"
      ZOO_SERVERS: |
        server.1=zookeeper1:2888:3888;2181
        server.2=zookeeper2:2888:3888;2181
        server.3=zookeeper3:2888:3888;2181
    expose:
      - "2181"
      - "2888"
      - "3888"
    volumes:
      - zookeeper1-data:/var/lib/zookeeper
    restart: unless-stopped

  zookeeper2:
    build: ./zookeeper
    environment:
      ZOO_MY_ID: "2"
      ZOO_SERVERS: |
        server.1=zookeeper1:2888:3888;2181
        server.2=zookeeper2:2888:3888;2181
        server.3=zookeeper3:2888:3888;2181
    expose:
      - "2181"
      - "2888"
      - "3888"
    volumes:
      - zookeeper2-data:/var/lib/zookeeper
    restart: unless-stopped

  zookeeper3:
    build: ./zookeeper
    environment:
      ZOO_MY_ID: "3"
      ZOO_SERVERS: |
        server.1=zookeeper1:2888:3888;2181
        server.2=zookeeper2:2888:3888;2181
        server.3=zookeeper3:2888:3888;2181
    expose:
      - "2181"
      - "2888"
      - "3888"
    volumes:
      - zookeeper3-data:/var/lib/zookeeper
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      ZK_HOSTS: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

volumes:
  zookeeper1-data:
  zookeeper2-data:
  zookeeper3-data:
